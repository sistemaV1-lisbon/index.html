<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Som Notificação 99 - Simulador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fcc500, #ff9500);
            padding: 20px;
        }
        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            font-size: 2rem;
            text-align: center;
        }
        .botao {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            color: #fff;
        }
        .botao.desligado { background: #e74c3c; }
        .botao.ligado { background: #27ae60; }
        .botao:active { transform: scale(0.95); }
        .status {
            margin-top: 30px;
            font-size: 1.3rem;
            color: #fff;
            font-weight: bold;
        }
        .info {
            margin-top: 20px;
            color: #fff;
            text-align: center;
            max-width: 300px;
            font-size: 0.95rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>🔔 Simulador de Som - Corrida 99</h1>

    <button id="btnControle" class="botao desligado">LIGAR</button>

    <div class="status" id="status">Parado</div>
    <div class="info">Clique no botão para iniciar/parar os sons de notificação</div>

    <script>
        const btn = document.getElementById('btnControle');
        const statusTxt = document.getElementById('status');
        let tocando = false;
        let intervalo;
        let contextoAudio = null;

        // Função para criar som parecido com notificação da 99
        function fazerSom() {
            if (!contextoAudio) contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
            
            // Tom principal - agudo e claro
            const osc1 = contextoAudio.createOscillator();
            const gain1 = contextoAudio.createGain();
            osc1.type = 'sine';
            osc1.frequency.value = 980; // Frequência alta característica
            gain1.gain.value = 0.3;

            // Segundo tom para dar "cor" ao som
            const osc2 = contextoAudio.createOscillator();
            const gain2 = contextoAudio.createGain();
            osc2.type = 'sine';
            osc2.frequency.value = 1470;
            gain2.gain.value = 0.15;

            // Conecta tudo
            osc1.connect(gain1);
            gain1.connect(contextoAudio.destination);
            osc2.connect(gain2);
            gain2.connect(contextoAudio.destination);

            // Ataque e liberação suave
            gain1.gain.exponentialRampToValueAtTime(0.001, contextoAudio.currentTime + 0.25);
            gain2.gain.exponentialRampToValueAtTime(0.001, contextoAudio.currentTime + 0.25);

            osc1.start();
            osc1.stop(contextoAudio.currentTime + 0.25);
            osc2.start();
            osc2.stop(contextoAudio.currentTime + 0.25);
        }

        // Ligar sons repetidos
        function ligar() {
            tocando = true;
            btn.textContent = 'DESLIGAR';
            btn.classList.remove('desligado');
            btn.classList.add('ligado');
            statusTxt.textContent = '🔔 Tocando...';
            // Toca logo de cara
            fazerSom();
            // Repete com intervalo similar a notificações
            intervalo = setInterval(fazerSom, 1400);
        }

        // Parar sons
        function desligar() {
            tocando = false;
            btn.textContent = 'LIGAR';
            btn.classList.remove('ligado');
            btn.classList.add('desligado');
            statusTxt.textContent = 'Parado';
            clearInterval(intervalo);
        }

        // Evento do botão
        btn.addEventListener('click', () => {
            if (tocando) desligar();
            else ligar();
        });
    </script>
</body>
</html>
