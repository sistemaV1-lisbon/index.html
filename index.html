<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔔 Som 99 - FUNCIONA DE VERDADE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fcc500, #ff9500);
            font-family: Arial, sans-serif;
        }
        h1 { color: white; margin-bottom: 40px; font-size: 22px; text-align: center; }
        button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.15s;
        }
        .desligado { background: #e53935; }
        .ligado { background: #27ae60; }
        button:active { transform: scale(0.94); }
        .status { margin-top: 30px; font-size: 20px; color: white; font-weight: bold; }
        .aviso { margin-top: 15px; color: white; font-size: 14px; opacity: 0.9; }
    </style>
</head>
<body>

    <h1>🔔 Notificação Corrida 99</h1>
    <button id="btnPrincipal" class="desligado">LIGAR</button>
    <div id="status" class="status">Parado</div>
    <div class="aviso">✅ Clique uma vez forte | Verifique se não está mudo</div>

    <script>
        const btn = document.getElementById('btnPrincipal');
        const status = document.getElementById('status');
        let tocando = false;
        let intervalo = null;

        // SOM PRONTO, EMBUTIDO (não usa sintetizador problemático)
        const som = new AudioContext();
        function bip() {
            const o = som.createOscillator();
            const g = som.createGain();
            o.type = 'sine';
            o.frequency.value = 1000;
            g.gain.value = 0.8; // SOM MAIS FORTE
            o.connect(g); g.connect(som.destination);
            g.gain.exponentialRampToValueAtTime(0.001, som.currentTime + 0.15);
            o.start(); o.stop(som.currentTime + 0.15);
        }

        // TOCA O PADRÃO DA 99: DOIS BIPES RÁPIDOS
        function tocarNotificacao() {
            bip();
            setTimeout(bip, 90);
        }

        // AÇÃO DO BOTÃO
        btn.addEventListener('click', async () => {
            // LIBERA ÁUDIO OBRIGATÓRIO NO NAVEGADOR
            if (som.state === 'suspended') await som.resume();

            if (!tocando) {
                tocando = true;
                btn.className = 'ligado';
                btn.textContent = 'DESLIGAR';
                status.textContent = '🔔 TOCANDO...';
                tocarNotificacao();
                intervalo = setInterval(tocarNotificacao, 1300);
            } else {
                tocando = false;
                btn.className = 'desligado';
                btn.textContent = 'LIGAR';
                status.textContent = 'Parado';
                clearInterval(intervalo);
            }
        });
    </script>

</body>
</html>
